<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Home Discovery Show</title>
<style>
html,body{margin:0;background:#041b2a;color:#fff;font-family:Arial,sans-serif}nav{position:sticky;top:0;background:#041b2a;border-bottom:1px solid #b9852f;z-index:5}nav div{max-width:1224px;margin:auto;display:flex;gap:7px;align-items:center;padding:9px;overflow:auto}.brand{font-family:Georgia,serif;font-weight:bold;margin-right:auto;white-space:nowrap}a{color:#fff;text-decoration:none;padding:8px 9px;white-space:nowrap;font-size:13px}a.active{color:#ffd889}main{max-width:1224px;margin:auto;background:#fff}img{display:block;width:100%;height:auto}@media(max-width:700px){.brand{display:none}}
</style></head>
<body><nav><div><span class="brand">The Home Discovery Show</span>
<a href="#home" data-p="home">Home</a><a href="#fourways" data-p="fourways">Four Ways In</a><a href="#episodes" data-p="episodes">Episodes</a><a href="#discover" data-p="discover">Discover</a><a href="#guest" data-p="guest">Be My Guest</a><a href="#about" data-p="about">About</a><a href="#swag" data-p="swag">Swag</a><a href="#contact" data-p="contact">Contact</a>
</div></nav><main><img id="art" alt="The Home Discovery Show approved page"></main>
<script>
const pages={home:'home.webp',fourways:'fourways.webp',episodes:'episodes.webp',discover:'discover.webp',guest:'guest.webp',about:'about.webp',swag:'swag.webp',contact:'contact.webp'};
function r(){let k=(location.hash||'#home').slice(1);if(!pages[k])k='home';art.src=pages[k];document.querySelectorAll('[data-p]').forEach(a=>a.classList.toggle('active',a.dataset.p===k));scrollTo(0,0)}addEventListener('hashchange',r);r();
</script></body></html>
